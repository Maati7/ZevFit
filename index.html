<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<title>ZevFit · Entrenamiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0f;--s1:#14161b;--s2:#1b1e25;--s3:#242832;--bd:#2a2f3a;
  --tx:#eef0f3;--mu:#8b92a0;--mu2:#5d6472;
  --ac:#c8f135;--ac2:#a6cc1f;--or:#ff8a3d;--rd:#ff5468;--bl:#4da3ff;--pu:#a78bfa;--pk:#ff6fb5;--ye:#ffd23f;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.3px}
h1{font-size:30px;margin:2px 0 0;font-weight:800;text-transform:uppercase}
h2{font-size:20px;margin:0;font-weight:700;text-transform:uppercase}
h3{font-size:17px;margin:0;font-weight:700}
.muted{color:var(--mu)}.small{font-size:12.5px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(11,12,15,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
header .wrap{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--ac);display:grid;place-items:center;flex:none}
.brand{font-family:"Barlow Condensed";font-weight:800;font-size:22px;letter-spacing:1.5px}
.vtitle{margin-left:auto;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mu2)}
.dot.ok{background:var(--ac)}.dot.err{background:var(--rd)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,19,24,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:64px}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mu2);font-size:10.5px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;position:relative}
nav button.on{color:var(--ac)}
nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
nav svg{width:22px;height:22px}

/* cards */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:12px 0}
.card.flat{background:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:12px;position:relative;overflow:hidden;min-height:98px}
.kpi::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c,var(--ac));opacity:.9}
.kpi .v{font-family:"Barlow Condensed";font-size:28px;font-weight:700;line-height:1.05;margin-top:6px}
.kpi .l{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);font-weight:600}
.kpi .x{font-size:12px;margin-top:3px}
.kpi .ic{position:absolute;right:10px;top:10px;color:var(--c,var(--ac));opacity:.9}
.tile{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px}
.tile b{font-family:"Barlow Condensed";font-size:22px;display:block;line-height:1}
.tile span{font-size:11px;color:var(--mu)}

.btn{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);color:#111;border-color:var(--ac)}
.btn.danger{color:var(--rd);border-color:#4a2530}
.btn.armed{background:var(--rd);color:#fff;border-color:var(--rd)}
.btn.wide{width:100%}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.ghost{background:transparent}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.tools .btn{flex-direction:column;gap:4px;padding:10px 6px;font-size:12.5px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mu)}
.chip.ok{background:rgba(200,241,53,.13);color:var(--ac)}
.chip.bad{background:rgba(255,84,104,.13);color:var(--rd)}
.chip.plan{background:rgba(77,163,255,.13);color:var(--bl)}
.mdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* streak */
.streak{display:flex;gap:14px;align-items:center}
.streak .big{font-family:"Barlow Condensed";font-size:54px;font-weight:800;line-height:.9;color:var(--ac)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:none;width:150px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s3);display:block}
.heat i.done{background:var(--ac)}
.heat i.missed{background:rgba(255,84,104,.45)}
.heat i.today{outline:2px solid var(--ac);outline-offset:-2px;background:var(--s3)}
.heat i.planned{background:transparent;border:1px dashed var(--mu2)}
.heat i.future{opacity:.35}
.heatlab{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;width:150px;font-size:9px;color:var(--mu2);text-align:center;margin-bottom:3px}

/* week strip */
.week{display:flex;align-items:center;gap:4px;margin:12px 0}
.week .arr{background:none;border:0;color:var(--mu);font-size:20px;width:26px;padding:0}
.week .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;flex:1}
.wd{background:var(--s1);border:1px solid var(--bd);border-radius:11px;padding:6px 0 7px;text-align:center}
.wd small{display:block;font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase}
.wd b{display:block;font-size:16px;margin:1px 0 3px}
.wd.sel{background:var(--ac);border-color:var(--ac);color:#111}
.wd.sel small{color:#111}
.wd.today:not(.sel){border-color:var(--ac)}
.sd{width:6px;height:6px;border-radius:50%;margin:0 auto;background:transparent}
.sd.done{background:var(--ac)}.sd.missed{background:var(--rd)}.sd.planned,.sd.today{background:var(--bl)}
.wd.sel .sd.done{background:#111}

/* groups */
.grp{border:1px solid var(--bd);border-left:3px solid var(--c);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--s2)}
.grp-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.gic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none}
.exr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--bd);background:var(--s1);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.exr .n{font-weight:600;font-size:14px}
.pill{font-size:11.5px;background:var(--s3);padding:2px 7px;border-radius:6px;color:var(--tx)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10.5px;color:var(--mu);text-align:center;font-weight:600;padding:4px 0}
.cd{background:var(--s2);border:1px solid transparent;border-radius:9px;min-height:52px;padding:4px 2px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cd.empty{background:transparent}
.cd.sel{border-color:var(--ac)}
.cd.today b{color:var(--ac)}
.cd .tg{font-size:9px;font-weight:700;letter-spacing:.3px;padding:1px 4px;border-radius:4px;max-width:100%;overflow:hidden;white-space:nowrap}
.cd .st{font-size:10px;line-height:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);margin-top:10px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:88vh;background:var(--bg);border:1px solid var(--bd);border-bottom:0;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
.sheet-panel.full{max-height:100vh;height:100%;border-radius:0}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}
.sheet-head .x{margin-left:auto;background:var(--s2);border:1px solid var(--bd);border-radius:10px;width:34px;height:34px}
.sheet-body{overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);display:flex;gap:8px;background:var(--s1)}

/* forms */
label.f{display:block;margin:12px 0}
label.f span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px;font-weight:600}
.in{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:none}
.in:focus{border-color:var(--ac)}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left}
label.f{min-width:0}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.sched{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin:6px 0}

/* workout */
.wk-ex{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-top:7px}
.setrow .num{width:26px;height:26px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:12px;font-weight:700}
.setrow input{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:9px;padding:9px 8px;text-align:center;font-weight:600;font-size:16px}
.setrow .ck{height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--s2);color:var(--mu)}
.setrow.done .ck{background:var(--ac);border-color:var(--ac);color:#111}
.setrow.done input{border-color:rgba(200,241,53,.35);color:var(--ac)}
.setrow.done .num{background:var(--ac);color:#111}
.sethead{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;text-align:center;margin-top:10px}

/* rest bar */
#rest{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#101216;border-top:2px solid var(--ac);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:none}
#rest.on{display:block}
#rest .t{font-family:"Barlow Condensed";font-size:34px;font-weight:800;color:var(--ac);min-width:84px}
#rest .bar{height:4px;background:var(--s3);border-radius:4px;margin-top:8px;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--ac);width:0}

/* toast */
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-10px);background:var(--s3);border:1px solid var(--bd);padding:10px 16px;border-radius:12px;z-index:90;opacity:0;pointer-events:none;transition:.25s;font-weight:600;font-size:14px;max-width:90%}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:22px 10px;color:var(--mu)}
.resume{border-color:var(--ac);background:rgba(200,241,53,.08);font-weight:600;color:var(--ac);cursor:pointer}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent}
.sw.on{border-color:#fff}
.lib-i{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.prog-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.prog-row:first-child{border-top:0}
svg text{font-family:Inter,sans-serif}
a{color:var(--bl)}
.anim{display:block;position:relative;overflow:hidden;border-radius:10px;background:#fff;flex:none}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.anim img.b{animation:flip 1.8s infinite}
@keyframes flip{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.anim.big{width:100%;aspect-ratio:3/2;border-radius:14px;margin-top:12px}
.anim.big img{object-fit:contain}
.anim.th{width:46px;height:46px}
.anim.sm{width:38px;height:38px;border-radius:8px}
.cue{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:1.5}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></div>
  <div class="brand">ZevFit</div>
  <div class="vtitle"><span id="vt">Inicio</span><span class="dot" id="syncdot" title="Estado de guardado"></span></div>
</div></header>

<main class="wrap" id="app"></main>

<nav><div class="wrap">
  <button data-a="nav" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Inicio</button>
  <button data-a="nav" data-v="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Rutinas</button>
  <button data-a="nav" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Progreso</button>
  <button data-a="nav" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</div></nav>

<div id="sheet" class="sheet hidden">
  <div class="sheet-bg" data-a="closeSheet"></div>
  <div class="sheet-panel" id="sheetPanel">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="x" data-a="closeSheet" aria-label="Cerrar">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot" style="display:none"></div>
  </div>
</div>

<div id="rest">
  <div class="row">
    <div class="t" id="restT">1:30</div>
    <div class="grow small muted">Descanso<br><span id="restNext" class="tiny"></span></div>
    <button class="btn sm" data-a="restAdj" data-d="-15">−15</button>
    <button class="btn sm" data-a="restAdj" data-d="15">+15</button>
    <button class="btn sm pri" data-a="restStop">Saltar</button>
  </div>
  <div class="bar"><i id="restBar"></i></div>
</div>
<div id="toast"></div>

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const todayISO=()=>iso(new Date());
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const DOWS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtLong=s=>{const d=parse(s);return `${DOWL[d.getDay()]} ${d.getDate()} de ${MON[d.getMonth()]}`};
const fmtShort=s=>{const d=parse(s);return `${d.getDate()}/${d.getMonth()+1}`};
const num=v=>{if(v===''||v==null)return NaN;return parseFloat(String(v).replace(',','.'))};
const r1=n=>Math.round(n*10)/10;
const fmtN=n=>(Math.round(n*10)/10).toLocaleString('es-AR',{maximumFractionDigits:1});
const fmtVol=v=>v>=1000?fmtN(v/1000)+' t':Math.round(v)+' kg';
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const e1=(w,r)=>(!(w>0)||!(r>0))?0:(r<=1?w:w*(1+r/30));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= catálogo ================= */
const MUSCLES={Piernas:'#c8f135',Pecho:'#ff8a3d',Espalda:'#4da3ff',Hombros:'#a78bfa',Brazos:'#ff6fb5',Core:'#ffd23f',Cardio:'#2ee6c5'};
const LIB_RAW=[
 ['Prensa de piernas','Piernas'],['Sentadilla hack','Piernas'],['Extensión de cuádriceps','Piernas'],['Curl femoral acostado','Piernas'],['Curl femoral sentado','Piernas'],['Abductores en máquina','Piernas'],['Aductores en máquina','Piernas'],['Gemelos en máquina','Piernas'],['Peso muerto rumano con mancuernas','Piernas'],['Zancadas con mancuernas','Piernas'],
 ['Press de pecho en máquina','Pecho'],['Press inclinado en máquina','Pecho'],['Aperturas en máquina (pec deck)','Pecho'],['Cruce de poleas','Pecho'],['Press con mancuernas en banco','Pecho'],
 ['Jalón al pecho','Espalda'],['Jalón agarre estrecho','Espalda'],['Remo sentado en polea','Espalda'],['Remo en máquina','Espalda'],['Pullover en polea','Espalda'],['Hiperextensiones','Espalda'],

const Store={db:null,uid:null,mode:'local',dirty:new Set(),writing:false,timer:null,known:new Set()};
function setSync(m){Store.mode=m;const d=$('#syncdot');d.className='dot'+(m==='cloud'?' ok':m==='error'?' err':'');d.title=m==='cloud'?'Guardado en tu cuenta':m==='error'?'Error al guardar en la nube':'Guardado solo en este dispositivo'}
function markDirty(...keys){saveLocal();for(const k of keys)Store.dirty.add(k);clearTimeout(Store.timer);Store.timer=setTimeout(flush,700)}
function markAll(){const ks=new Set(['config','body',...Store.known,...Object.keys(S.sessions).map(d=>'s-'+d)]);markDirty(...ks)}
async function flush(){
  if(!Store.db||!Store.uid||Store.writing)return;
  Store.writing=true;
  try{
    while(Store.dirty.size){
      const k=Store.dirty.values().next().value;Store.dirty.delete(k);
      const ref=Store.db.collection('data/users/'+Store.uid).doc(k);
      let body=null;
      if(k==='config')body=S.config;else if(k==='body')body=S.body;else if(k.startsWith('s-'))body=S.sessions[k.slice(2)]||null;
      try{
        if(body){await ref.set({json:JSON.stringify(body),t:Date.now()});Store.known.add(k)}
        else{await ref.delete();Store.known.delete(k)}
        setSync('cloud');
      }catch(e){
        if(e&&e.code==='unavailable'){Store.dirty.add(k);await sleep(800+Math.random()*800)}
        else{console.warn('db',e);setSync('error');break}
      }
    }
  }finally{Store.writing=false;if(Store.dirty.size&&Store.mode!=='error'){clearTimeout(Store.timer);Store.timer=setTimeout(flush,1500)}}
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    Store.db=db;Store.uid=uid;
    const snap=await Promise.race([db.collection('data/users/'+uid).get(),sleep(10000).then(()=>null)]);
    if(!snap){toast('No se pudo leer la nube; sigo con lo guardado acá');return}
    let remote={config:null,body:null,sessions:{}},maxT=0;
    for(const d of snap.docs){
      const v=d.data();if(!v||!v.json)continue;Store.known.add(d.id);maxT=Math.max(maxT,v.t||0);
      let o;try{o=JSON.parse(v.json)}catch(e){continue}
      if(d.id==='config')remote.config=o;else if(d.id==='body')remote.body=o;else if(d.id.startsWith('s-'))remote.sessions[d.id.slice(2)]=o;
    }
    const hasLocal=Object.keys(S.sessions).length||Object.keys(S.body.entries).length||S.savedAt;
    if(!remote.config&&!Store.known.size){ if(hasLocal)markAll(); setSync('cloud'); }
    else if((S.savedAt||0)>maxT){ markAll(); setSync('cloud'); }
    else{ S=normalize({config:remote.config||S.config,body:remote.body||S.body,sessions:remote.sessions}); S.savedAt=maxT; try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){} setSync('cloud'); render(); }
    flush();
  }catch(e){console.warn(e)}
}

/* ================= lógica ================= */
function routineFor(date){
  const s=S.sessions[date];
  if(s&&s.routineId)return S.config.routines[s.routineId]?s.routineId:null;
  const o=S.config.overrides[date];
  if(o!==undefined)return o==='rest'?null:(S.config.routines[o]?o:null);
  const r=S.config.schedule[parse(date).getDay()];
  return r&&S.config.routines[r]?r:null;
}
function statusOf(date){
  const s=S.sessions[date],t=todayISO();
  if(s&&s.status==='done')return 'done';
  if(!routineFor(date))return 'rest';
  if(date<S.config.startDate)return 'none';
  if(date<t)return 'missed';
  if(date===t)return 'today';
  return 'planned';
}
function sessVol(s){let v=0;if(!s||!s.sets)return 0;const m=exMap();for(const id in s.sets){if(m[id]&&m[id].time)continue;for(const x of s.sets[id])if(x.done&&!x.warm){const w=num(x.w),r=num(x.r);if(w>0&&r>0)v+=w*r}}return v}
function doneSessions(){return Object.values(S.sessions).filter(s=>s.status==='done').sort((a,b)=>a.date<b.date?-1:1)}
function earliest(){let e=S.config.startDate;for(const d in S.sessions)if(d<e)e=d;return e}
function streakInfo(){
  const t=todayISO();let cur=0,d=t;const stop=addDays(earliest(),-1);
  while(d>stop){const st=statusOf(d);if(st==='done')cur++;else if(st==='missed')break;d=addDays(d,-1)}
  let best=0,run=0;for(let x=earliest();x<=t;x=addDays(x,1)){const st=statusOf(x);if(st==='done'){run++;best=Math.max(best,run)}else if(st==='missed')run=0}
  return {cur,best:Math.max(best,cur)};
}
function adherence(from,to){let p=0,d=0;for(let x=from;x<=to;x=addDays(x,1)){const st=statusOf(x);if(st==='done'){p++;d++}else if(st==='missed')p++}return {p,d,pct:p?Math.round(d/p*100):null}}
function volBetween(a,b){let v=0,n=0;for(const s of doneSessions())if(s.date>=a&&s.date<=b){v+=sessVol(s);n++}return {v,n}}
function lastSetsFor(id,before){const ss=doneSessions().filter(s=>s.date<before&&s.sets&&s.sets[id]&&s.sets[id].some(x=>x.done));return ss.length?ss[ss.length-1].sets[id].filter(x=>!x.warm):null}
function exHistory(id){const out=[];for(const s of doneSessions()){const st=s.sets&&s.sets[id];if(!st)continue;let best=0,top=0;for(const x of st)if(x.done&&!x.warm){const w=num(x.w),r=num(x.r);best=Math.max(best,e1(w,r));if(w>top)top=w}if(best>0)out.push({date:s.date,best:r1(best),top,sets:st})}return out}
function routineStats(R){let sets=0,m=5;for(const e of R.ex){const x=exInfo(e.id);if(x.time&&x.unit==='min'){m+=(+e.reps||0)*(+e.sets||1)}else{sets+=(+e.sets||0);m+=(+e.sets||0)*(45+(+S.config.restSec||90))/60}}return {n:R.ex.length,sets,min:Math.round(m)}}
function bodyLatest(field,upto){const t=upto||todayISO();const ds=Object.keys(S.body.entries).filter(d=>d<=t&&S.body.entries[d][field]!=null&&S.body.entries[d][field]!=='').sort();return ds.length?{date:ds[ds.length-1],v:num(S.body.entries[ds[ds.length-1]][field])}:null}
function bodyAvg(field,from,to){let s=0,n=0;for(const d in S.body.entries)if(d>=from&&d<=to){const v=num(S.body.entries[d][field]);if(v>=0&&!isNaN(v)){s+=v;n++}}return n?s/n:null}

/* ---------- gráficos SVG ---------- */
function radarSVG(axes,cur,prev){
  const W=320,H=270,cx=160,cy=135,R=95,n=axes.length;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px;display:block;margin:0 auto">`;
  for(const lv of [25,50,75,100])s+=`<polygon points="${axes.map((_,i)=>pt(i,lv).join(',')).join(' ')}" fill="none" stroke="#2a2f3a" stroke-width="1"/>`;
  axes.forEach((a,i)=>{const[x,y]=pt(i,100);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2a2f3a"/>`;const[lx,ly]=pt(i,122);s+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="11" fill="#8b92a0">${a}</text>`});
  s+=`<polygon points="${prev.map((v,i)=>pt(i,Math.max(v||0,2)).join(',')).join(' ')}" fill="rgba(139,146,160,.15)" stroke="#5d6472" stroke-dasharray="4 3"/>`;
  s+=`<polygon points="${cur.map((v,i)=>pt(i,Math.max(v||0,2)).join(',')).join(' ')}" fill="rgba(200,241,53,.22)" stroke="#c8f135" stroke-width="2"/>`;
  cur.forEach((v,i)=>{const[x,y]=pt(i,Math.max(v||0,2));s+=`<circle cx="${x}" cy="${y}" r="3" fill="#c8f135"/>`});
  return s+'</svg>';
}
function barsSVG(data){ // [{label,v,n}]
  const W=340,H=170,pl=8,pr=8,pt=14,pb=24;const max=Math.max(1,...data.map(d=>d.v));const bw=(W-pl-pr)/data.length;const ih=H-pt-pb;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(const g of [0.5,1])s+=`<line x1="${pl}" x2="${W-pr}" y1="${pt+ih*(1-g)}" y2="${pt+ih*(1-g)}" stroke="#22262f" stroke-dasharray="3 3"/>`;
  const pts=[];
  data.forEach((d,i)=>{const h=d.v/max*ih;const x=pl+i*bw+bw*.18;s+=`<rect x="${x}" y="${pt+ih-h}" width="${bw*.64}" height="${Math.max(h,d.v?2:0)}" rx="4" fill="${i===data.length-1?'#c8f135':'#ff6fb5'}" opacity="${i===data.length-1?1:.85}"/>`;s+=`<text x="${pl+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="10" fill="#5d6472">${d.label}</text>`;pts.push([pl+i*bw+bw/2,pt+ih-(d.n/7)*ih])});
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ffd23f" stroke-width="2"/>`;
  data.forEach((d,i)=>{s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3.5" fill="#ffd23f"/>`;if(d.n)s+=`<text x="${pts[i][0]}" y="${pts[i][1]-7}" text-anchor="middle" font-size="9.5" fill="#ffd23f">${d.n}</text>`});
  return s+'</svg>';
}
function lineSVG(pts,opts={}){ // [{x:dateISO,y}]
  const W=340,H=opts.h||170,pl=34,pr=10,pt=12,pb=22;if(pts.length<2)return '';
  const ys=pts.map(p=>p.y).concat(opts.goal!=null?[opts.goal]:[]);let mn=Math.min(...ys),mx=Math.max(...ys);if(mx-mn<1){mn-=1;mx+=1}const padY=(mx-mn)*.12;mn-=padY;mx+=padY;
  const t0=parse(pts[0].x).getTime(),t1=parse(pts[pts.length-1].x).getTime()||t0+1;const X=d=>pl+(parse(d).getTime()-t0)/Math.max(1,t1-t0)*(W-pl-pr);const Y=v=>pt+(1-(v-mn)/(mx-mn))*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#22262f" stroke-dasharray="3 3"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end" font-size="9.5" fill="#5d6472">${fmtN(v)}</text>`}
  if(opts.goal!=null)s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(opts.goal)}" y2="${Y(opts.goal)}" stroke="#c8f135" stroke-dasharray="5 4" opacity=".6"/><text x="${W-pr}" y="${Y(opts.goal)-4}" text-anchor="end" font-size="9.5" fill="#c8f135">objetivo</text>`;
  const c=opts.color||'#4da3ff';const line=pts.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ');
  s+=`<polygon points="${X(pts[0].x)},${H-pb} ${line} ${X(pts[pts.length-1].x)},${H-pb}" fill="${c}" opacity=".1"/><polyline points="${line}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
  if(pts.length<=30)pts.forEach(p=>s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="2.6" fill="${c}"/>`);
  s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#5d6472">${fmtShort(pts[0].x)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end" font-size="10" fill="#5d6472">${fmtShort(pts[pts.length-1].x)}</text>`;
  return s+'</svg>';
}
function spark(vals,c='#c8f135'){if(vals.length<2)return '<span class="tiny muted">—</span>';const W=70,H=24,mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;return `<svg width="${W}" height="${H}"><polyline points="${vals.map((v,i)=>`${i/(vals.length-1)*(W-4)+2},${H-3-(v-mn)/rg*(H-6)}`).join(' ')}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`}

function scores(ref){
  const C=S.config;
  const ad=adherence(addDays(ref,-27),ref);const cons=ad.pct==null?0:ad.pct;
  const v0=volBetween(addDays(ref,-6),ref).v;let pv=0;for(let k=1;k<=4;k++)pv+=volBetween(addDays(ref,-6-7*k),addDays(ref,-7*k)).v;pv/=4;
  const vol=pv?clamp(v0/pv*60):(v0?60:0);
  const ids=new Set();for(const s of doneSessions())for(const id in (s.sets||{}))ids.add(id);
  const rat=[];for(const id of ids){const h=exHistory(id);const a=h.filter(x=>x.date>addDays(ref,-14)&&x.date<=ref),b=h.filter(x=>x.date>addDays(ref,-60)&&x.date<=addDays(ref,-15));if(a.length&&b.length)rat.push(Math.max(...a.map(x=>x.best))/Math.max(...b.map(x=>x.best)))}
  const fuer=rat.length?clamp(50+(rat.reduce((x,y)=>x+y,0)/rat.length-1)*500):0;
  const sl=bodyAvg('sleep',addDays(ref,-6),ref);const sue=sl==null?0:clamp(sl/C.sleepGoal*100);
  const wa=bodyAvg('water',addDays(ref,-6),ref);const hid=wa==null?0:clamp(wa/C.waterGoal*100);
  let pes=0;const ds=Object.keys(S.body.entries).filter(d=>S.body.entries[d].w&&d<=ref).sort();
  if(C.goalWeight&&ds.length){const st=num(S.body.entries[ds[0]].w),cu=num(S.body.entries[ds[ds.length-1]].w),g=num(C.goalWeight);pes=st===g?100:clamp((st-cu)/(st-g)*100)}
  return [fuer,vol,cons,sue,hid,pes].map(Math.round);
}

function vProgress(){
  const t=todayISO(),C=S.config;const ds=doneSessions();const st=streakInfo();
  const tot=ds.reduce((a,s)=>a+sessVol(s),0);
  let h=`<h1 style="margin-top:14px">Progreso</h1><div class="muted small">Cómo venís, con números</div>`+muscleCard();
  h+=`<div class="grid3" style="margin-top:12px"><div class="tile"><b>${ds.length}</b><span>entrenos</span></div><div class="tile"><b>${fmtVol(tot)}</b><span>volumen total</span></div><div class="tile"><b>${st.best}</b><span>mejor racha</span></div></div>`;
  // radar
  const axes=['Fuerza','Volumen','Constancia','Sueño','Hidratación','Peso'];const cur=scores(t),prev=scores(addDays(t,-30));
  h+=`<div class="card"><div class="row between"><h3>Atleta 360°</h3><span class="tiny muted">0–100</span></div>${radarSVG(axes,cur,prev)}<div class="legend" style="justify-content:center;margin-top:0"><span><span class="mdot" style="background:var(--ac)"></span> Actual</span><span><span class="mdot" style="background:#5d6472"></span> Hace 30 días</span></div><div class="grid3" style="margin-top:10px">${axes.map((a,i)=>`<div class="tile" style="padding:8px"><b style="font-size:18px">${cur[i]}</b><span>${a} ${cur[i]>prev[i]?'<span style="color:var(--ac)">↗</span>':cur[i]<prev[i]?'<span style="color:var(--rd)">↘</span>':''}</span></div>`).join('')}</div><details style="margin-top:10px"><summary class="small muted">¿Cómo se calcula?</summary><div class="small muted" style="margin-top:6px;line-height:1.5"><b>Fuerza:</b> 1RM estimado de las últimas 2 semanas vs. el mes anterior (50 = igual, 100 = +10%).<br><b>Volumen:</b> kg de la última semana vs. tu promedio de 4 semanas (60 = igual).<br><b>Constancia:</b> % de entrenos planificados que hiciste en 28 días.<br><b>Sueño / Hidratación:</b> promedio de 7 días vs. tu objetivo.<br><b>Peso:</b> avance desde tu primer registro hacia el peso objetivo${C.goalWeight?'':' (configuralo en Ajustes)'}.</div></details></div>`;
  // volumen semanal
  const weeks=[];for(let k=7;k>=0;k--){const a=addDays(mondayOf(t),-7*k);const r=volBetween(a,addDays(a,6));weeks.push({label:fmtShort(a),v:r.v,n:r.n})}
  h+=`<div class="card"><h3>Volumen semanal</h3><div class="tiny muted" style="margin-bottom:6px">kg levantados (barras) y entrenos por semana (línea)</div>${barsSVG(weeks)}</div>`;
  // peso
  const wp=Object.keys(S.body.entries).filter(d=>d>=addDays(t,-90)&&S.body.entries[d].w).sort().map(d=>({x:d,y:num(S.body.entries[d].w)}));
  h+=`<div class="card"><div class="row between"><h3>Peso corporal</h3><button class="btn sm" data-a="bodyLog">+ Registrar</button></div>${wp.length>=2?lineSVG(wp,{goal:C.goalWeight?num(C.goalWeight):null,color:'#c8f135'}):'<div class="empty small">Registrá tu peso al menos 2 días para ver la curva.</div>'}</div>`;
  // sueño
  const sp=Object.keys(S.body.entries).filter(d=>d>=addDays(t,-30)&&S.body.entries[d].sleep).sort().map(d=>({x:d,y:num(S.body.entries[d].sleep)}));
  if(sp.length>=2)h+=`<div class="card"><h3>Sueño (30 días)</h3>${lineSVG(sp,{goal:C.sleepGoal,color:'#a78bfa',h:140})}</div>`;
  // 1RM
  const ids=new Set();for(const s of ds)for(const id in (s.sets||{}))ids.add(id);
  const rows=[...ids].map(id=>({id,ex:exInfo(id),h:exHistory(id)})).filter(r=>r.h.length&&!r.ex.time).sort((a,b)=>a.h[a.h.length-1].date<b.h[b.h.length-1].date?1:-1);
  h+=`<div class="card"><h3>1RM estimado por ejercicio</h3><div class="tiny muted" style="margin-bottom:6px">Fórmula de Epley: peso × (1 + reps/30). Tocá uno para ver el detalle.</div>`;
  if(!rows.length)h+='<div class="empty small">Registrá entrenos con peso para ver tu 1RM estimado.</div>';
  for(const r of rows){const last=r.h[r.h.length-1];const ref=r.h.filter(x=>x.date<=addDays(t,-28));const base=ref.length?ref[ref.length-1]:r.h[0];const dlt=base&&base!==last?(last.best-base.best)/base.best*100:0;
    h+=`<div class="prog-row" data-a="exInfo" data-id="${r.id}" style="cursor:pointer"><span class="mdot" style="background:${MUSCLES[r.ex.muscle]||'#888'}"></span><div class="grow"><div style="font-weight:600;font-size:14px">${esc(r.ex.name)}</div><div class="tiny muted">${fmtN(last.best)} kg${dlt?` · <span style="color:${dlt>0?'var(--ac)':'var(--rd)'}">${dlt>0?'+':''}${fmtN(dlt)}%</span>`:''}</div></div>${spark(r.h.slice(-10).map(x=>x.best),MUSCLES[r.ex.muscle])}</div>`}
  h+='</div>';
  return h;
}

  h+=`<div class="card"><h3>Datos</h3><div class="row" style="margin:8px 0"><span class="dot ${Store.mode==='cloud'?'ok':Store.mode==='error'?'err':''}"></span><span class="small muted">${syncTxt}</span></div>

  h+=`<div class="tiny muted" style="text-align:center;margin:18px 0">ZevFit · tu entrenamiento, tus datos</div>`;

function sheetBody(){

function muscleLoad(at){
  const now=at||Date.now();const t=todayISO();const out={};for(const k in REG)out[k]={fat:0,vol:0,ever:false};
  for(const s of doneSessions()){
    const sh=parse(s.date).getTime()+18*3600e3;const h=Math.max(0,(now-sh)/3600e3);const recent=s.date>=addDays(t,-6);
    if(h>24*10&&!recent){for(const id in (s.sets||{})){const mm=MM[id];if(mm)for(const r of mm[0])out[r].ever=true}continue}
    for(const id in (s.sets||{})){const ex=exInfo(id);if(ex.time&&ex.unit==='min')continue;const mm=MM[id];if(!mm)continue;
      const n=s.sets[id].filter(x=>x.done&&!x.warm).length;if(!n)continue;const dec=Math.max(0,1-h/72);
      for(const [arr,w] of [[mm[0],1],[mm[1],.5]])for(const r of arr){out[r].fat+=n*w*12*dec;if(recent)out[r].vol+=n*w;out[r].ever=true}}
  }
  for(const k in out){out[k].rec=Math.round(100-Math.min(100,out[k].fat));out[k].vol=r1(out[k].vol)}
  return out;
}

/* ================= calentamiento ================= */
function warmupFor(e){
  const work=e.sets.filter(s=>!s.warm);const W=num((work[0]||{}).w);if(!(W>0))return null;
  const inc=W>=40?2.5:1.25;const rd=x=>Math.max(inc,Math.round(x/inc)*inc);
  const plan=W>=60?[[.5,10],[.7,5],[.85,3]]:W>=20?[[.5,10],[.75,5]]:[[.5,10]];
  return plan.map(([p,r])=>({w:rd(W*p),r,done:false,warm:true}));
}

function encodeWeek(){

  const d={};for(const k in C.schedule){const i=ids.indexOf(C.schedule[k]);if(i>=0)d[k]=i}
  const c=(C.customEx||[]).filter(x=>used.has(x.id)).map(x=>[x.id,x.name,x.muscle]);
  const o={v:1,n:C.name?'Semana de '+C.name:'Rutina compartida',r,d,c,rest:C.restSec};
  return 'ZEVFIT-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));

  const base={'prensa-de-piernas':100,'press-de-pecho-en-maquina':35,'jalon-al-pecho':40,'press-de-hombros-en-maquina':25,'curl-de-biceps-en-polea':20,'crunch-en-polea':25,'extension-de-cuadriceps':35,'curl-femoral-sentado':30,'remo-sentado-en-polea':40,'aperturas-en-maquina-pec-deck':30,'elevaciones-laterales-en-polea':7.5,'extension-de-triceps-en-polea':20,'sentadilla-hack':60,'press-inclinado-en-maquina':30,'jalon-agarre-estrecho':40,'face-pull-en-polea':15,'gemelos-en-maquina':50,'plancha':0,'cruce-de-poleas':10,'extension-de-triceps-sobre-la-cabeza-en-polea':15,'fondos-en-maquina':40,'pajaros-en-maquina':20,'pullover-en-polea':20,'curl-martillo-con-mancuernas':10};
  let rnd=7;const R=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
  for(let d=start;d<t;d=addDays(d,1)){
    const rid=C.schedule[parse(d).getDay()];
    if(rid&&R()<.86){const wk=Math.floor((parse(d)-parse(start))/864e5/7);const sets={};
      for(const e of C.routines[rid].ex){const b=exInfo(e.id).time?0:(base[e.id]??20);const inc=b>=40?2.5:1.25;const w=b?Math.round((b*(1+.025*wk))/inc)*inc:0;
        sets[e.id]=Array.from({length:e.sets},(_,i)=>({w,r:e.id==='plancha'?30+wk*3:Math.max(6,e.reps-(i===2&&R()<.5?2:0)),done:true}))}
      st.sessions[d]={date:d,routineId:rid,status:'done',dur:45+Math.round(R()*15),sets}}
    const k=(parse(d)-parse(start))/864e5;
    st.body.entries[d]={w:r1(80.6-k*.07+(R()-.5)*.6),sleep:r1(6.4+R()*1.9),water:r1(1.8+R()*1.4)};
  }

  return st;
}

  wkCheck:a=>{const s=Wk.W.ex[+a.dataset.e].sets[+a.dataset.s];s.done=!s.done;if(s.done&&!(num(s.r)>0))s.r=Wk.W.ex[+a.dataset.e].target||10;saveDraft();renderWk();if(s.done&&!Wk.W.edit)startRest(s.warm?45:(+S.config.restSec||90))},
  wkAddSet:a=>{const e=Wk.W.ex[+a.dataset.e];const l=e.sets[e.sets.length-1]||{w:'',r:e.target};e.sets.push({w:l.w,r:l.r,done:false});saveDraft();renderWk()},
  wkDelSet:a=>{const e=Wk.W.ex[+a.dataset.e];if(e.sets.filter(x=>!x.warm).length>1)e.sets.pop();saveDraft();renderWk()},
  wkAddEx:()=>{UI.libPick='__wk';UI.libQ='';sheetLibWk()},
  wkFinish:()=>finishWk(),
  wkWarm:a=>{const e=Wk.W.ex[+a.dataset.e];if(e.sets.some(x=>x.warm)){e.sets=e.sets.filter(x=>!x.warm)}else{const w=warmupFor(e);if(!w){toast('Primero cargá el peso de tu primera serie');return}e.sets=w.concat(e.sets);toast('Calentamiento agregado')}saveDraft();renderWk()},
  wkAlt:a=>sheetAlt(+a.dataset.e),
  altPick:a=>{const W=Wk.W;const ei=Sheet.altEi;const old=W.ex[ei];const nid=a.dataset.id;const nx=exInfo(nid);const n=old.sets.filter(x=>!x.warm).length||3;const last=lastSetsFor(nid,W.date);const tgt=old.target||10;
    W.ex[ei]={id:nid,target:tgt,sets:Array.from({length:n},(_,i)=>({w:last&&last.length?(last[i]||last[last.length-1]).w:'',r:tgt,done:false}))};
    UI.altSave=!!($('#altSave')&&$('#altSave').checked);
    if(UI.altSave){const R=S.config.routines[W.routineId];const i=R?R.ex.findIndex(x=>x.id===old.id):-1;if(i>=0){R.ex[i].id=nid;markDirty('config')}}
    saveDraft();toast('Cambiado por '+nx.name);openWorkout(W.date)},
  mmode:a=>{UI.mmode=a.dataset.m;render()},
  musc:a=>{UI.msel=UI.msel===a.dataset.k?null:a.dataset.k;render()},
  shareWeek:()=>sheetShare(),
  shareCopy:async()=>{const t=$('#shareTxt').value;try{await navigator.clipboard.writeText(t);toast('Mensaje copiado')}catch(e){const el=$('#shareTxt');el.focus();el.select();toast('Seleccionado: copialo con el menú')}},
  importCode:()=>sheetImport(),
  codeUse:a=>{const o=decodeWeek($('#codeTxt').value);if(!o){toast('Ese código no es válido');return}twoTap(a,'Reemplaza tus rutinas · tocá otra vez',()=>{applyShared(o);markDirty('config');closeSheet();UI.view='routines';UI.sel=todayISO();render();toast('Rutina cargada: '+o.n)})},
  wkInfo:a=>{sheetExInfo(a.dataset.id);Sheet.back='wk'},
  wkDiscard:a=>twoTap(a,'¿Seguro?',()=>{clearDraft();clearInterval(Wk.iv);stopRest(false);closeSheet();toast('Entreno descartado')}),
  delSess:a=>twoTap(a,'¿Borrar?',()=>{delete S.sessions[a.dataset.d];markDirty('s-'+a.dataset.d);render();toast('Registro borrado')}),
  restSheet:()=>sheetRest(),
  restGo:a=>{closeSheet();startRest(+a.dataset.s)},
  restAdj:a=>{const d=+a.dataset.d;Rest.end=Math.max(Date.now()+1000,Rest.end+d*1000);Rest.total=Math.max(1,Rest.total+d);beep((Rest.end-Date.now())/1000);tickRest()},
  restStop:()=>stopRest(false),
  lib:()=>{UI.libPick=null;UI.libQ='';sheetLib()},
  exInfo:a=>{const fromProg=Sheet.kind==='prog';sheetExInfo(a.dataset.id);if(fromProg)Sheet.back='prog'},
  editor:()=>sheetEditor(),
  addEx:a=>{UI.libPick=a.dataset.r;UI.libQ='';sheetLib()},
  pickEx:a=>{const id=a.dataset.id;const ex=exInfo(id);
    if(UI.libPick==='__wk'){UI.libPick=null;const dr=ex.unit==='min'&&ex.time?20:ex.time?30:10;Wk.W.ex.push({id,target:dr,sets:(ex.unit==='min'&&ex.time?[0]:[0,1,2]).map(()=>({w:'',r:dr,done:false}))});saveDraft();const W=Wk.W;Sheet._replaceOk=false;openWorkout(W.date);toast('Agregado');return}
    const R=S.config.routines[UI.libPick];if(!R)return;R.ex.push({id,sets:ex.time&&ex.unit==='min'?1:3,reps:ex.time&&ex.unit==='min'?20:ex.time?30:10});markDirty('config');UI.libPick=null;toast(ex.name+' agregado');sheetEditor()},
  newEx:()=>{const n=$('#newExName').value.trim();if(!n){toast('Escribí un nombre');return}const id='c-'+slug(n);if(exMap()[id]){toast('Ya existe');return}S.config.customEx.push({id,name:n,muscle:$('#newExMuscle').value});markDirty('config');$('#newExName').value='';renderLibList();toast('Ejercicio creado')},
  rcolor:a=>{S.config.routines[a.dataset.r].color=a.dataset.c;markDirty('config');Sheet._keep=true;sheetEditor()},
  emove:a=>{const R=S.config.routines[a.dataset.r];const i=+a.dataset.x;if(i<=0)return;[R.ex[i-1],R.ex[i]]=[R.ex[i],R.ex[i-1]];markDirty('config');Sheet._keep=true;sheetEditor()},
  edel:a=>{const R=S.config.routines[a.dataset.r];R.ex.splice(+a.dataset.x,1);markDirty('config');Sheet._keep=true;sheetEditor()},
  newRoutine:()=>{const ids=Object.keys(S.config.routines);let id='R'+Date.now().toString(36);const n=ids.length+1;S.config.routines[id]={id,name:'Rutina '+n,short:'R'+n,color:PALETTE[n%PALETTE.length],ex:[]};markDirty('config');Sheet._keep=true;sheetEditor();setTimeout(()=>{$('#sheetBody').scrollTop=1e6},50)},
  delRoutine:a=>twoTap(a,'¿Eliminar?',()=>{const id=a.dataset.r;const used=Object.values(S.sessions).some(s=>s.routineId===id);if(used){toast('Tiene entrenos registrados: no se puede borrar');return}delete S.config.routines[id];for(const k in S.config.schedule)if(S.config.schedule[k]===id)delete S.config.schedule[k];for(const k in S.config.overrides)if(S.config.overrides[k]===id)delete S.config.overrides[k];markDirty('config');Sheet._keep=true;sheetEditor()}),
  programs:()=>sheetPrograms(),
  obGoal:a=>{S.config.goal=a.dataset.g;document.querySelectorAll('.ob-goal').forEach(b=>b.classList.toggle('pri',b===a))},
  obStart:()=>{const n=($('#obName').value||'').trim();if(!n){toast('Escribí tu nombre');return}S.config.name=n;S.config.onboarded=true;UI.progGoal=S.config.goal;markDirty('config');render();sheetPrograms()},
  progGoal:a=>{UI.progGoal=a.dataset.g;sheetPrograms()},
  progView:a=>{Sheet.progId=a.dataset.id;sheetProgram(a.dataset.id)},
  progUse:a=>twoTap(a,'Reemplaza tus rutinas · tocá otra vez',()=>{const p=PROGRAMS.find(x=>x.id===a.dataset.id);applyProgram(p);markDirty('config');UI.sel=todayISO();closeSheet();UI.view='routines';render();toast('Programa activado: '+p.name)}),
  demo:a=>twoTap(a,'Reemplaza tus datos · tocá otra vez',()=>{replaceState(makeDemo());toast('Datos de ejemplo cargados')}),
  wipe:a=>twoTap(a,'¿Borrar TODO?',()=>{replaceState(freshState());toast('Datos borrados')}),
  exportData:async()=>{const txt=JSON.stringify({app:'zevfit',v:1,config:S.config,body:S.body,sessions:S.sessions});try{await navigator.clipboard.writeText(txt);toast('Respaldo copiado. Pegalo en Notas o un mail.')}catch(e){Sheet.kind='exp';openSheet('Respaldo',`<div class="small muted" style="margin:12px 0">Copiá este texto y guardalo:</div><textarea class="in" style="height:260px;font-size:11px" readonly>${esc(txt)}</textarea>`)}},
  importData:()=>{Sheet.kind='imp';openSheet('Importar respaldo',`<div class="small muted" style="margin:12px 0">Pegá el texto del respaldo. Reemplaza los datos actuales.</div><textarea class="in" id="impTxt" style="height:220px;font-size:11px"></textarea>`,{foot:`<button class="btn grow" data-a="closeSheet">Cancelar</button><button class="btn pri grow" data-a="doImport">Importar</button>`})},
  doImport:()=>{try{const o=JSON.parse($('#impTxt').value);if(!o.config||!o.sessions)throw 0;closeSheet();replaceState(normalize(o));toast('Respaldo importado')}catch(e){toast('Ese texto no es un respaldo válido')}}
};
function sheetLibWk(){Sheet.kind='lib';openSheet('Agregar ejercicio',`<input class="in" data-i="libq" placeholder="Buscar ejercicio…" style="margin-top:12px"><div id="libList"></div>`);renderLibList()}
A.closeSheet=(function(orig){return ()=>{if(Sheet.kind==='alt'){const d=loadDraft();if(d){openWorkout(d.date);return}}if(Sheet.kind==='ex'&&Sheet.back==='prog'){Sheet.back=null;sheetProgram(Sheet.progId);return}if(Sheet.back==='wk'&&Sheet.kind==='ex'){Sheet.back=null;const d=loadDraft();if(d){openWorkout(d.date);return}}Sheet.back=null;if(Sheet.kind==='lib'&&UI.libPick==='__wk'){UI.libPick=null;Sheet._replaceOk=false;openWorkout(Wk.W.date);return}orig()}})(A.closeSheet);

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const f=A[a.dataset.a];if(f){e.preventDefault();f(a,e)}});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset.i;
  if(k==='wset'){const s=Wk.W.ex[+el.dataset.e].sets[+el.dataset.s];s[el.dataset.f]=el.value;saveDraft()}
  else if(k==='libq'){UI.libQ=el.value;renderLibList()}
  else if(k==='codeTxt'){const o=decodeWeek(el.value);$('#codePrev').innerHTML=o?`<div class="small" style="margin:12px 0 0;color:var(--ac)">✓ ${esc(o.n)} · ${o.r.length} rutina${o.r.length>1?'s':''}</div>`+weekSummary(o):(el.value.trim()?'<div class="small" style="margin-top:10px;color:var(--rd)">Todavía no reconozco un código válido</div>':'')}
  else if(k==='rname'){S.config.routines[el.dataset.r].name=el.value||'Rutina';markDirty('config')}
  else if(k==='rshort'){S.config.routines[el.dataset.r].short=el.value.toUpperCase()||'R';markDirty('config')}
  else if(k==='esets'){const n=parseInt(el.value);if(n>0&&n<20){S.config.routines[el.dataset.r].ex[+el.dataset.x].sets=n;markDirty('config')}}
  else if(k==='ereps'){const n=parseInt(el.value);if(n>0&&n<1000){S.config.routines[el.dataset.r].ex[+el.dataset.x].reps=n;markDirty('config')}}
});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='bDate'){fillBody();return}
  if(el.dataset.cfg){const k=el.dataset.cfg;let v=el.value;if(['goalWeight','waterGoal','sleepGoal','restSec'].includes(k)){const n=num(v);v=isNaN(n)?(k==='goalWeight'?null:S.config[k]):n}if(k==='startDate'&&!v)return;S.config[k]=v;markDirty('config');if(k!=='name')render();else render();return}
  if(el.dataset.c==='sched'){const dw=el.dataset.dw;if(el.value)S.config.schedule[dw]=el.value;else delete S.config.schedule[dw];markDirty('config');return}
  if(el.dataset.c==='dayRoutine'){const d=UI.sel;if(el.value==='__plan')delete S.config.overrides[d];else S.config.overrides[d]=el.value;markDirty('config');render()}
});

/* ================= arranque ================= */
loadLocal();setSync('local');render();initCloud();
</script>
</body>
